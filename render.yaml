services:
  - type: web
    name: hass-tiendita
    runtime: static
    buildCommand: "bash ./render-build.sh"
    staticPublishPath: "./build/web"
    headers:
      - path: /*
        name: Cross-Origin-Embedder-Policy
        value: require-corp
      - path: /*
        name: Cross-Origin-Opener-Policy
        value: same-origin
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
